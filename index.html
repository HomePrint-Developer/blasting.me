<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blasting.me - Dashboard</title>

    <!-- Font Figtree (Bawaan UI Laravel 10/11/12) -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SweetAlert2 untuk Pop-up Eror -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Kustomisasi font dan scrollbar -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .swal2-popup {
            font-family: 'Figtree', sans-serif !important;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

    <!-- Header / Tipografi Logo -->
    <div class="mb-6 text-center">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">blasting.me</h1>
    </div>

    <!-- Card Container -->
    <div class="w-full max-w-md px-8 py-8 bg-white border border-gray-100 shadow-sm rounded-2xl">

        <form id="waForm" class="space-y-6">

            <!-- Input Pesan -->
            <div>
                <label for="message" class="block font-medium text-sm text-gray-700">Pesan Broadcast</label>
                <textarea id="message" name="message" rows="4" required
                    placeholder="Tuliskan pesan yang ingin dikirim..."
                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:border-red-500 focus:ring focus:ring-red-500 focus:ring-opacity-50 transition border p-3 outline-none text-sm"></textarea>
            </div>

            <!-- Input Nomor Handphone -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="phone" class="block font-medium text-sm text-gray-700">Nomor Target (Massal)</label>
                    
                    <!-- Tombol Kontak HP (Disembunyikan secara default) -->
                    <button type="button" id="btnContactPicker" class="hidden text-xs font-semibold text-red-600 hover:text-red-800 flex items-center gap-1 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        Ambil dari Kontak
                    </button>
                </div>

                <textarea id="phone" name="phone" rows="5" required
                    placeholder="085754207467&#10;081234567890&#10;(Pisahkan dengan Enter)"
                    class="block w-full border-gray-300 rounded-md shadow-sm focus:border-red-500 focus:ring focus:ring-red-500 focus:ring-opacity-50 transition border p-3 outline-none text-sm font-mono"></textarea>
                <p class="mt-2 text-xs text-gray-500">Gunakan format angka. Setiap nomor diletakkan di baris baru.</p>
            </div>

            <!-- Action Button -->
            <div class="flex items-center justify-end mt-4">
                <button type="submit" id="submitBtn"
                    class="inline-flex items-center px-6 py-3 bg-gray-800 border border-transparent rounded-lg font-semibold text-xs text-white uppercase tracking-widest hover:bg-gray-700 focus:bg-gray-700 active:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition ease-in-out duration-150 w-full justify-center">
                    Kirim Pesan
                </button>
            </div>

        </form>
    </div>

    <script>
        // ==========================================
        // FITUR CONTACT PICKER API
        // ==========================================
        const btnContact = document.getElementById('btnContactPicker');
        const phoneTextarea = document.getElementById('phone');

        // Cek apakah browser HP mendukung fitur ambil kontak
        if ('contacts' in navigator && 'ContactsManager' in window) {
            btnContact.classList.remove('hidden'); // Munculkan tombol
            
            btnContact.addEventListener('click', async () => {
                try {
                    // Minta izin baca nomor telepon (tel), bisa multiple (banyak sekaligus)
                    const contacts = await navigator.contacts.select(['tel'], { multiple: true });
                    
                    if (contacts.length > 0) {
                        let extractedNumbers = [];
                        
                        // Ekstrak semua nomor telepon yang dipilih dari kontak
                        contacts.forEach(contact => {
                            if (contact.tel && contact.tel.length > 0) {
                                // Ambil nomor pertama dari kontak tersebut, bersihkan dari spasi/karakter
                                let cleanNum = contact.tel[0].replace(/[^0-9+]/g, '');
                                
                                // Jika format depannya +62, ubah jadi 0 agar seragam (atau biarkan, logika blasting kita sudah menyesuaikan)
                                if (cleanNum.startsWith('+62')) {
                                    cleanNum = '0' + cleanNum.substring(3);
                                }
                                
                                extractedNumbers.push(cleanNum);
                            }
                        });

                        // Gabungkan ke textarea tanpa menghapus nomor yang sudah ada di sana
                        let existingText = phoneTextarea.value.trim();
                        let newText = extractedNumbers.join('\n');
                        
                        if (existingText === '') {
                            phoneTextarea.value = newText;
                        } else {
                            phoneTextarea.value = existingText + '\n' + newText;
                        }
                    }
                } catch (error) {
                    console.log('Pengguna membatalkan pilihan kontak atau terjadi eror:', error);
                }
            });
        }

        // ==========================================
        // LOGIKA SUBMIT DAN BLASTING
        // ==========================================
        document.getElementById('waForm').addEventListener('submit', function (e) {
            e.preventDefault();

            let phoneInput = phoneTextarea.value;
            let message = document.getElementById('message').value;

            // Pisahkan input berdasarkan baris baru atau koma, bersihkan spasi
            let rawNumbers = phoneInput.split(/[\n,]+/).map(num => num.trim()).filter(num => num !== '');

            // Validasi Input Kosong
            if (rawNumbers.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Data Kosong',
                    text: 'Silakan masukkan minimal satu nomor handphone target.',
                    confirmButtonText: 'Mengerti',
                    customClass: {
                        popup: 'rounded-2xl shadow-xl border border-gray-100',
                        confirmButton: 'w-full mt-4 bg-gray-800 hover:bg-gray-700 text-white font-semibold rounded-lg px-6 py-3 transition tracking-widest uppercase text-xs'
                    },
                    buttonsStyling: false
                });
                return;
            }

            let invalidNumbers = [];
            let validNumbers = [];

            // Pengecekan setiap nomor
            rawNumbers.forEach(num => {
                let cleanNum = num.replace(/\s+/g, '');
                // Jika diawali +62, bersihkan tanda +
                if (cleanNum.startsWith('+')) cleanNum = cleanNum.substring(1);

                if (!/^[0-9]+$/.test(cleanNum)) {
                    invalidNumbers.push(`<b>${cleanNum}</b> <span class="text-xs ml-1">(Bukan angka)</span>`);
                } 
                else if (cleanNum.length < 11) {
                    invalidNumbers.push(`<b>${cleanNum}</b> <span class="text-xs ml-1">(Kurang dari 11 digit)</span>`);
                } 
                else {
                    validNumbers.push(cleanNum);
                }
            });

            // Pop-up Eror
            if (invalidNumbers.length > 0) {
                let errorListHtml = invalidNumbers.map(err => 
                    `<li class="text-left text-sm text-red-700 bg-red-50 p-2.5 rounded-lg border border-red-100 flex items-center gap-2">
                        <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span>${err}</span>
                    </li>`
                ).join('');
                
                Swal.fire({
                    icon: 'error',
                    title: 'Format Tidak Valid',
                    html: `
                        <div class="mt-2 text-sm text-gray-600 mb-4 text-left">
                            Terdapat nomor yang tidak sesuai ketentuan (harus murni angka & minimal 11 digit):
                        </div>
                        <ul class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                            ${errorListHtml}
                        </ul>
                        <div class="mt-4 text-xs text-gray-500 text-left border-t pt-3 border-gray-100">
                            Silakan perbaiki kolom isian sebelum melanjutkan pengiriman.
                        </div>
                    `,
                    confirmButtonText: 'Perbaiki',
                    customClass: {
                        popup: 'rounded-2xl shadow-xl border border-gray-100 p-6',
                        title: 'text-gray-900 font-bold text-xl',
                        confirmButton: 'w-full mt-4 bg-gray-800 hover:bg-gray-700 text-white font-semibold rounded-lg px-6 py-3 transition tracking-widest uppercase text-xs'
                    },
                    buttonsStyling: false
                });
                
                return; 
            }

            // Ambil nomor pertama
            let currentNumber = validNumbers.shift();

            // Kembalikan antrean ke textarea
            phoneTextarea.value = validNumbers.join('\n');

            // Ubah tombol
            const submitBtn = document.getElementById('submitBtn');
            if (validNumbers.length > 0) {
                submitBtn.innerText = `Kirim Berikutnya (${validNumbers.length} Antrean)`;
                submitBtn.classList.replace('bg-gray-800', 'bg-amber-600');
                submitBtn.classList.replace('hover:bg-gray-700', 'hover:bg-amber-500');
                submitBtn.classList.replace('active:bg-gray-900', 'active:bg-amber-700');
            } else {
                submitBtn.innerText = 'Kirim Pesan';
                submitBtn.classList.replace('bg-amber-600', 'bg-gray-800');
                submitBtn.classList.replace('hover:bg-amber-500', 'hover:bg-gray-700');
                submitBtn.classList.replace('active:bg-amber-700', 'active:bg-gray-900');
            }

            // Normalisasi +62 atau awalan 0
            if (currentNumber.startsWith('62') === false) {
                if (currentNumber.startsWith('0')) {
                    currentNumber = '62' + currentNumber.substring(1);
                } else if (!currentNumber.startsWith('62')) {
                    // Jika diketik tanpa 0 dan tanpa 62 (misal langsung 812xxx)
                    currentNumber = '62' + currentNumber;
                }
            }

            // Buka WhatsApp
            let encodedMessage = encodeURIComponent(message);
            let waUrl = `https://wa.me/${currentNumber}?text=${encodedMessage}`;
            window.open(waUrl, '_blank');
        });
    </script>

</body>

</html>
