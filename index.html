<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blasting.me - Dashboard</title>

    <!-- Font Figtree -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SweetAlert2 untuk Pop-up Eror -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Kustomisasi font dan scrollbar -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .swal2-popup {
            font-family: 'Figtree', sans-serif !important;
        }
    </style>
</head>

<body
    class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

    <!-- Header / Tipografi Logo -->
    <div class="mb-6 text-center">
        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">blasting.me</h1>
    </div>

    <!-- Card Container -->
    <div class="w-full max-w-md px-8 py-8 bg-white border border-slate-200 shadow-sm rounded-xl">

        <form id="waForm" class="space-y-6">

            <!-- Input Pesan -->
            <div>
                <label for="message" class="block font-medium text-sm text-slate-700">Pesan Broadcast</label>
                <textarea id="message" name="message" rows="4" required
                    placeholder="Tuliskan pesan yang ingin dikirim..."
                    class="mt-1 block w-full border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-500 focus:ring-opacity-50 transition border p-3 outline-none text-sm"></textarea>
            </div>

            <!-- Input Nomor Handphone -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="phone" class="block font-medium text-sm text-slate-700">Nomor Target (Massal)</label>

                    <!-- Tombol Kontak HP -->
                    <button type="button" id="btnContactPicker"
                        class="hidden text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        Ambil dari Kontak
                    </button>
                </div>

                <textarea id="phone" name="phone" rows="5" required
                    placeholder="085754207467&#10;081234567890&#10;(Pisahkan dengan Enter)"
                    class="block w-full border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-500 focus:ring-opacity-50 transition border p-3 outline-none text-sm font-mono"></textarea>
                <p class="mt-2 text-xs text-slate-500">Gunakan format angka. Setiap nomor diletakkan di baris baru.</p>
            </div>

            <!-- Action Button -->
            <div class="flex items-center justify-end mt-4">
                <button type="submit" id="submitBtn"
                    class="inline-flex items-center px-6 py-3 bg-indigo-600 border border-transparent rounded-lg font-semibold text-xs text-white uppercase tracking-widest hover:bg-indigo-700 focus:bg-indigo-700 active:bg-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition ease-in-out duration-150 w-full justify-center shadow-sm">
                    Kirim Pesan
                </button>
            </div>

        </form>
    </div>

    <script>
        // ==========================================
        // FITUR CONTACT PICKER API
        // ==========================================
        const btnContact = document.getElementById('btnContactPicker');
        const phoneTextarea = document.getElementById('phone');

        if ('contacts' in navigator && 'ContactsManager' in window) {
            btnContact.classList.remove('hidden');
            btnContact.addEventListener('click', async () => {
                try {
                    const contacts = await navigator.contacts.select(['tel'], { multiple: true });
                    if (contacts.length > 0) {
                        let extractedNumbers = [];
                        contacts.forEach(contact => {
                            if (contact.tel && contact.tel.length > 0) {
                                let cleanNum = contact.tel[0].replace(/[^0-9+]/g, '');
                                if (cleanNum.startsWith('+62')) {
                                    cleanNum = '0' + cleanNum.substring(3);
                                }
                                extractedNumbers.push(cleanNum);
                            }
                        });
                        let existingText = phoneTextarea.value.trim();
                        let newText = extractedNumbers.join('\n');
                        phoneTextarea.value = existingText === '' ? newText : existingText + '\n' + newText;
                    }
                } catch (error) {
                    console.log('Pengguna membatalkan pilihan kontak atau terjadi eror:', error);
                }
            });
        }

        // ==========================================
        // LOGIKA SUBMIT DAN BLASTING
        // ==========================================

        // Flag agar peringatan spam hanya muncul 1x per sesi
        let hasAgreedToSpamWarning = false;

        document.getElementById('waForm').addEventListener('submit', function (e) {
            e.preventDefault();

            let phoneInput = phoneTextarea.value;
            let message = document.getElementById('message').value;

            // Bersihkan format input
            let rawNumbers = phoneInput.split(/[\n,]+/).map(num => num.trim()).filter(num => num !== '');

            // Validasi Data Kosong
            if (rawNumbers.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Data Kosong',
                    text: 'Silakan masukkan minimal satu nomor handphone target.',
                    confirmButtonText: 'Mengerti',
                    customClass: {
                        popup: 'rounded-xl shadow-xl border border-slate-200',
                        confirmButton: 'w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg px-6 py-3 transition tracking-widest uppercase text-xs'
                    },
                    buttonsStyling: false
                });
                return;
            }

            let invalidNumbers = [];
            let validNumbers = [];

            // Pengecekan setiap nomor
            rawNumbers.forEach(num => {
                let cleanNum = num.replace(/\s+/g, '');
                if (cleanNum.startsWith('+')) cleanNum = cleanNum.substring(1);

                if (!/^[0-9]+$/.test(cleanNum)) {
                    invalidNumbers.push(`<b>${cleanNum}</b> <span class="text-xs ml-1">(Bukan angka)</span>`);
                }
                else if (cleanNum.length < 11) {
                    invalidNumbers.push(`<b>${cleanNum}</b> <span class="text-xs ml-1">(Kurang dari 11 digit)</span>`);
                }
                else {
                    validNumbers.push(cleanNum);
                }
            });

            // Pop-up Eror (Jika format nomor ada yang salah)
            if (invalidNumbers.length > 0) {
                let errorListHtml = invalidNumbers.map(err =>
                    `<li class="text-left text-sm text-rose-700 bg-rose-50 p-2.5 rounded-lg border border-rose-100 flex items-center gap-2">
                        <svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span>${err}</span>
                    </li>`
                ).join('');

                Swal.fire({
                    icon: 'error',
                    title: 'Format Tidak Valid',
                    html: `
                        <div class="mt-2 text-sm text-slate-600 mb-4 text-left">
                            Terdapat nomor yang tidak sesuai ketentuan (harus murni angka & minimal 11 digit):
                        </div>
                        <ul class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                            ${errorListHtml}
                        </ul>
                    `,
                    confirmButtonText: 'Perbaiki',
                    customClass: {
                        popup: 'rounded-xl shadow-xl border border-slate-200 p-6',
                        title: 'text-slate-800 font-bold text-xl',
                        confirmButton: 'w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg px-6 py-3 transition tracking-widest uppercase text-xs'
                    },
                    buttonsStyling: false
                });

                return;
            }

            // Fungsi Inti untuk Mengeksekusi API WhatsApp
            const proceedWithSending = () => {
                let currentNumber = validNumbers.shift();
                phoneTextarea.value = validNumbers.join('\n');

                const submitBtn = document.getElementById('submitBtn');
                if (validNumbers.length > 0) {
                    submitBtn.innerText = `Kirim Berikutnya (${validNumbers.length} Antrean)`;
                    submitBtn.classList.replace('bg-indigo-600', 'bg-rose-600');
                    submitBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-rose-500');
                    submitBtn.classList.replace('active:bg-indigo-900', 'active:bg-rose-700');
                    submitBtn.classList.replace('focus:ring-indigo-500', 'focus:ring-rose-500');
                } else {
                    submitBtn.innerText = 'Kirim Pesan';
                    submitBtn.classList.replace('bg-rose-600', 'bg-indigo-600');
                    submitBtn.classList.replace('hover:bg-rose-500', 'hover:bg-indigo-700');
                    submitBtn.classList.replace('active:bg-rose-700', 'active:bg-indigo-900');
                    submitBtn.classList.replace('focus:ring-rose-500', 'focus:ring-indigo-500');
                }

                if (currentNumber.startsWith('62') === false) {
                    if (currentNumber.startsWith('0')) {
                        currentNumber = '62' + currentNumber.substring(1);
                    } else if (!currentNumber.startsWith('62')) {
                        currentNumber = '62' + currentNumber;
                    }
                }

                let encodedMessage = encodeURIComponent(message);
                let waUrl = `https://wa.me/${currentNumber}?text=${encodedMessage}`;
                window.open(waUrl, '_blank');
            };

            // Jika belum setuju peringatan spam, tampilkan Pop-Up
            if (!hasAgreedToSpamWarning) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Peringatan Risiko Spam',
                    html: `
                        <div class="mt-2 text-sm text-slate-600 text-left">
                            Mengirim pesan massal (blasting) memiliki risiko terdeteksi sebagai spam oleh pihak WhatsApp.<br><br>
                            Situs <b>blasting.me</b> tidak bertanggung jawab atas pemblokiran (banned) atau sanksi apapun yang terjadi pada nomor yang digunakan untuk mengirim pesan.
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Mengerti',
                    cancelButtonText: 'Batal',
                    customClass: {
                        popup: 'rounded-xl shadow-xl border border-slate-200 p-6',
                        title: 'text-slate-800 font-bold text-xl',
                        actions: 'w-full !flex !flex-row gap-3 mt-4',
                        confirmButton: 'flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg px-4 py-3 transition tracking-widest uppercase text-xs !m-0',
                        cancelButton: 'flex-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold rounded-lg px-4 py-3 transition uppercase text-xs !m-0'
                    },
                    buttonsStyling: false
                }).then((result) => {
                    if (result.isConfirmed) {
                        hasAgreedToSpamWarning = true; // Tandai agar pop-up tidak muncul lagi di klik selanjutnya
                        proceedWithSending(); // Lanjutkan eksekusi
                    }
                });
            } else {
                // Jika sudah setuju sebelumnya, langsung eksekusi tanpa pop-up
                proceedWithSending();
            }

        });
    </script>

</body>

</html>
